# Investiční analýzy pro appku Život — generuje Claude Code (headless),
# takže je platí Max předplatné, ne API kredity.
#
# Ráno před otevřením trhů a večer po zavírce (časy v UTC; Praha = UTC+2 v létě).
name: Investiční analýzy

on:
  schedule:
    - cron: '5 4 * * *'    # ~6:05 Praha → ranní „pre"
    - cron: '15 20 * * *'  # ~22:15 Praha → večerní „post"
  workflow_dispatch:
    inputs:
      session:
        description: 'pre nebo post (prázdné = podle času)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: analyza
  cancel-in-progress: false

jobs:
  analyza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Nainstalovat Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Vygenerovat analýzu
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node analyza/gen_analyza.mjs ${{ github.event.inputs.session }}

      - name: Commit a push
        run: |
          git config user.name "zivot-bot"
          git config user.email "actions@github.com"
          git add analyza/
          git diff --cached --quiet && echo "Nic nového" && exit 0
          git commit -m "Analýza $(date -u +%F) [skip ci]"
          git push
