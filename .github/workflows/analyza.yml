# Investiční analýzy pro appku Život — generuje Claude Code (headless),
# takže je platí Max předplatné, ne API kredity.
#
# Ráno před otevřením trhů a večer po zavírce (časy v UTC; Praha = UTC+2 v létě).
name: Investiční analýzy

on:
  schedule:
    # GitHub crony běžně vynechá nebo o hodiny zpozdí — proto záložní časy.
    # Skript sám pozná, že výstup už existuje, a podruhé nic negeneruje.
    - cron: '5 4 * * *'    # ~6:05 Praha → ranní „pre"
    - cron: '50 4 * * *'   # záloha pre
    - cron: '40 5 * * *'   # záloha pre
    - cron: '15 20 * * *'  # ~22:15 Praha → večerní „post"
    - cron: '0 21 * * *'   # záloha post
    - cron: '50 21 * * *'  # záloha post
  workflow_dispatch:
    inputs:
      session:
        description: 'pre nebo post (prázdné = podle času)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: analyza
  cancel-in-progress: false

jobs:
  analyza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Nainstalovat Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # Yahoo blokuje požadavky z datacenter podle TLS otisku — curl_cffi
      # se vydává za Chrome a projde. Node by z runneru dostal samé 429.
      - name: Stáhnout tržní data (curl_cffi)
        run: |
          pip install --quiet curl_cffi
          python analyza/fetch_markets.py

      - name: Vygenerovat analýzu
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # GitHub spouští crony i s hodinami zpoždění — relaci proto určuje
          # cron výraz, který běh vyvolal, ne aktuální hodina.
          SESSION: ${{ github.event_name == 'schedule' && (contains(fromJSON('["15 20 * * *","0 21 * * *","50 21 * * *"]'), github.event.schedule) && 'post' || 'pre') || github.event.inputs.session }}
        run: node analyza/gen_analyza.mjs $SESSION

      - name: Commit a push
        run: |
          git config user.name "zivot-bot"
          git config user.email "actions@github.com"
          git add analyza/
          git diff --cached --quiet && echo "Nic nového" && exit 0
          git commit -m "Analýza $(date -u +%F) [skip ci]"
          git push
